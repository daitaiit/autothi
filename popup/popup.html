<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoThi - Trợ Lý Làm Bài Thi</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-box">⚡</div>
        <div>
          <h1 class="brand-title">AutoThi AI</h1>
          <div class="brand-subtitle" id="active-contest-name">Đã sẵn sàng hỗ trợ làm bài</div>
        </div>
      </div>
      <div class="status-pill ready" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Sẵn sàng</span>
      </div>
    </header>

    <!-- Notification / Update Banner (Tự động hiện khi có đề mới) -->
    <div id="update-banner" class="update-banner hidden">
      <div class="banner-content">
        <span class="banner-icon">🎁</span>
        <div class="banner-text">
          <div class="banner-title" id="banner-title">Có gói đề thi mới!</div>
          <div class="banner-sub" id="banner-sub">Cập nhật câu hỏi & đáp án chuẩn nhất</div>
        </div>
      </div>
      <button id="btn-quick-update" class="btn-quick-update">Cập nhật ngay</button>
    </div>

    <!-- Main Big Action -->
    <div class="main-action-card">
      <button id="btn-start" class="btn-action-start">
        <span class="btn-icon">⚡</span>
        <span class="btn-text">BẮT ĐẦU LÀM BÀI</span>
      </button>

      <button id="btn-stop" class="btn-action-stop hidden">
        <span class="btn-icon">⏹</span>
        <span class="btn-text">DỪNG LẠI</span>
      </button>
    </div>

    <!-- Mode Selector: Tự động vs Gợi ý -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="auto" id="mode-auto">
        <span class="mode-icon">🤖</span>
        <div class="mode-info">
          <div class="mode-title">Tự động làm</div>
          <div class="mode-desc">Tự chọn đáp án & chuyển câu</div>
        </div>
      </button>
      <button class="mode-btn" data-mode="highlight" id="mode-highlight">
        <span class="mode-icon">🎯</span>
        <div class="mode-info">
          <div class="mode-title">Chỉ gợi ý</div>
          <div class="mode-desc">Tô xanh đáp án để tự bấm</div>
        </div>
      </button>
    </div>

    <!-- Simple Settings -->
    <div class="simple-settings">
      <div class="setting-row">
        <div class="setting-left">
          <span class="setting-title">Tự động bấm câu tiếp theo</span>
          <span class="setting-sub">Sau khi giải xong tự chuyển câu</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chk-auto-next" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div class="setting-left">
          <span class="setting-title">Tốc độ làm bài</span>
          <span class="setting-sub">Mô phỏng như người thật</span>
        </div>
        <div class="speed-options">
          <button class="speed-btn" data-speed="1000">Nhanh</button>
          <button class="speed-btn active" data-speed="2200">Vừa phải</button>
          <button class="speed-btn" data-speed="4000">Chậm rãi</button>
        </div>
      </div>
    </div>

    <!-- Footer Stats & Info -->
    <footer class="simple-footer">
      <div class="footer-stat">
        <span>📊 Ngân hàng đề:</span>
        <b id="footer-bank-count">0 câu hỏi</b>
      </div>
      <button id="btn-sync-now" class="btn-link" title="Đồng bộ lại đề mới từ máy chủ">
        🔄 Làm mới đề
      </button>
    </footer>

    <!-- Toast message -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
